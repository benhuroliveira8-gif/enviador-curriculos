# Configuração do Enviador de Currículos.
# Dá para editar por aqui, pelo painel (aba Configurações) ou com: python -m enviador configurar
# NUNCA compartilhe este arquivo: ele guarda senha de e-mail e chave da IA.

candidato:
  nome: "Seu Nome Completo"
  email: "seu.email@gmail.com"
  telefone: "(51) 99999-9999"
  linkedin: "https://linkedin.com/in/seu-perfil"
  curriculo_pdf: "curriculo.pdf"          # seu currículo em PDF, nesta pasta
  pretensao_salarial: ""     # opcional; aparece nas fichas de candidatura
  resumo: >-
    Breve resumo profissional em 2 ou 3 frases. Ele vai nas mensagens enviadas às empresas e
    nas respostas dos formulários.

busca:
  palavras_chave: ["analista de suporte", "técnico de TI"]     # cargos que você procura
  palavras_excluidas: ["sênior", "senior", "estágio", "estagiário"]     # vagas com estes termos no título são ignoradas
  cidades: ["Porto Alegre"]     # vazio = qualquer lugar
  aceitar_remoto: true
  dias_maximos: 15     # ignora vagas publicadas há mais tempo
  fontes:
    gupy: true     # vagas de todas as áreas
    adzuna: false     # agrega vários sites; precisa de app_id e app_key (abaixo)
    github_vagas: false     # repositórios de vagas de programação; muitas trazem e-mail
  repositorios_github: ["backend-br/vagas", "frontendbr/vagas", "react-brasil/vagas", "qa-brasil/vagas"]
  github_token: ""     # opcional; aumenta o limite de consultas ao GitHub
  adzuna:     # cadastro gratuito em https://developer.adzuna.com
    app_id: ""
    app_key: ""
    onde: ""     # região da busca na Adzuna; vazio = Brasil todo

analise:
  usar_ia: true     # análise com IA (precisa da chave em ia.chave_api)
  nota_minima: 65     # vagas com nota a partir daqui são recomendadas (0 a 100)
  nota_minima_pre_filtro: 25     # abaixo disso a vaga nem vai para a IA
  max_analises_ia: 30     # máximo de vagas analisadas pela IA por busca

ia:
  chave_api: ""     # chave da Anthropic (console.anthropic.com); começa com sk-

envio:
  modo_teste: true     # true = candidatura por e-mail só mostra o que enviaria
  max_por_dia: 15
  intervalo_segundos: [60, 180]     # espera aleatória entre envios
  copia_para_mim: true
  empresas_bloqueadas: []     # nunca enviar para estas empresas
  automatico_no_diario: false     # true = a rotina diária também envia candidaturas por e-mail

smtp:     # conta que envia os e-mails. Gmail: use uma "senha de app"
  servidor: "smtp.gmail.com"
  porta: 587
  usuario: "seu.email@gmail.com"
  senha: ""

aviso:     # resumo diário por e-mail
  email: true
  para: ""     # vazio = o seu e-mail do bloco candidato
  nota_alerta: 75     # vagas com nota a partir daqui viram destaque
  enviar_sem_novidades: false

acompanhamento:
  dias_followup: 10     # lembrete de follow-up após tantos dias sem novidade

raiox:
  nota_minima_area: 30     # vagas abaixo disso são de outra área
  areas: []     # vazio = todas; ex.: ["ti", "administrativo"]
  habilidades_extras: {}     # ex.: {"Fortinet NSE": ["fortinet", "nse ?[1-4]"]}

mensagem:
  usar_ia: true     # respostas e e-mails escritos sob medida pela IA
  assunto: "Candidatura - {cargo} - {nome}"
  modelo: |
    Olá, equipe de recrutamento{empresa_frase}!

    Vi a vaga de {cargo} e gostaria de me candidatar. {resumo}

    Envio meu currículo em anexo e fico à disposição para uma conversa.

    Atenciosamente,
    {nome}
    {telefone}
