<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas vagas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --fundo: #EEF1F4;
  --superficie: #FFFFFF;
  --tinta: #16212E;
  --secundario: #5D6B7A;
  --linha: #D5DBE2;
  --cobalto: #2350C8;
  --cobalto-claro: #E3EAFA;
  --verde: #1E7A52;
  --verde-claro: #E2F2EA;
  --ambar: #A85A12;
  --ambar-claro: #FBEEDD;
  --vermelho: #A3261E;
  --sombra: 0 1px 2px rgba(22, 33, 46, .06);
  --raio: 8px;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", var(--sans);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #10161E; --superficie: #18212C; --tinta: #E6EBF1; --secundario: #93A1B1;
    --linha: #2A3644; --cobalto: #7EA0FF; --cobalto-claro: #1E2A47; --verde: #5CC796;
    --verde-claro: #16302A; --ambar: #E8A35C; --ambar-claro: #3A2914; --vermelho: #F08A80;
    --sombra: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta);
  font: 400 16px/1.5 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cobalto); }
:focus-visible { outline: 2px solid var(--cobalto); outline-offset: 2px; border-radius: 4px; }

.casca { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }

/* topo */
.topo {
  display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end;
  justify-content: space-between; padding: 28px 0 18px;
}
.topo h1 { font: 600 30px/1.1 var(--cond); margin: 0; letter-spacing: .005em; }
.topo p { margin: 4px 0 0; color: var(--secundario); }
.busca-agora { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.busca-agora .estado { color: var(--secundario); font-size: 14px; max-width: 360px; }

/* botões */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha);
  background: var(--superficie); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  font-weight: 500; font-size: 15px; text-decoration: none; color: var(--tinta); white-space: nowrap;
}
.btn:hover { border-color: var(--secundario); }
.btn.primario { background: var(--cobalto); border-color: var(--cobalto); color: #fff; }
.btn.primario:hover { filter: brightness(1.08); }
@media (prefers-color-scheme: dark) { .btn.primario { color: #0E1420; } }
.btn.sutil { border-color: transparent; background: transparent; color: var(--secundario); }
.btn.sutil:hover { color: var(--tinta); background: var(--cobalto-claro); }
.btn[disabled] { opacity: .55; cursor: progress; }

/* abas */
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--linha); overflow-x: auto; }
.aba {
  border: 0; background: none; padding: 10px 14px 11px; cursor: pointer; color: var(--secundario);
  font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.aba[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--cobalto); }
.aba .n { font: 600 15px var(--cond); margin-left: 4px; color: var(--secundario); }
.aba .n.alerta { color: var(--ambar); }

/* ferramentas */
.ferramentas { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 0; align-items: center; }
.ferramentas input[type=search] {
  flex: 1 1 240px; min-width: 0; padding: 8px 12px; border: 1px solid var(--linha);
  border-radius: 6px; background: var(--superficie);
}
.ferramentas select { padding: 8px 10px; border: 1px solid var(--linha); border-radius: 6px; background: var(--superficie); }
.ferramentas[hidden], .ferramentas [hidden] { display: none; }

/* fila de vagas */
.fila { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); }
.vaga { border-top: 1px solid var(--linha); }
.vaga:first-child { border-top: 0; }
.vaga-linha {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; padding: 16px 18px; align-items: start;
}
.nota { text-align: left; }
.nota b { display: block; font: 600 38px/0.95 var(--cond); font-variant-numeric: tabular-nums; }
.medidor { height: 4px; background: var(--linha); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.medidor i { display: block; height: 100%; background: currentColor; }
.nota small { display: block; color: var(--secundario); font-size: 12px; margin-top: 5px; }
.n-alta { color: var(--verde); } .n-boa { color: var(--cobalto); } .n-baixa { color: var(--secundario); }
.info h3 { margin: 0; font: 600 18px/1.3 var(--sans); }
.info .onde { color: var(--secundario); font-size: 15px; margin-top: 1px; }
.info .por-que { margin: 6px 0 0; max-width: 68ch; }
.etiqueta {
  display: inline-block; font-size: 13px; font-weight: 500; padding: 1px 8px; border-radius: 999px;
  background: var(--cobalto-claro); color: var(--cobalto); margin-left: 6px; vertical-align: 2px;
}
.etiqueta.depois { background: var(--ambar-claro); color: var(--ambar); }
.acoes { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; }
@media (max-width: 1000px) {
  .vaga-linha { grid-template-columns: 76px 1fr; }
  .acoes { grid-column: 2; justify-content: flex-start; flex-wrap: wrap; }
}

.detalhe { padding: 0 18px 18px 110px; display: grid; gap: 16px; }
.detalhe[hidden] { display: none; }
.grupo h4 { margin: 0 0 6px; font: 600 15px var(--sans); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; padding: 2px 10px; border-radius: 999px; }
.chip.favor { background: var(--verde-claro); color: var(--verde); }
.chip.falta { background: var(--ambar-claro); color: var(--ambar); }
.resposta { border: 1px solid var(--linha); border-radius: 6px; padding: 12px 14px; background: var(--fundo); }
.resposta header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.resposta header strong { font-weight: 600; font-size: 15px; }
.resposta p { margin: 0; white-space: pre-wrap; max-width: 75ch; }
.resposta ul { margin: 0; padding-left: 18px; }
.nota-rodape { color: var(--secundario); font-size: 14px; margin: 0; }

/* candidaturas */
.quadro { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.coluna h3 { font: 600 16px var(--sans); margin: 0 0 8px; display: flex; justify-content: space-between; }
.coluna h3 span { font: 600 16px var(--cond); color: var(--secundario); }
.coluna .vazia { color: var(--secundario); font-size: 14px; padding: 8px 0; }
.item {
  background: var(--superficie); border: 1px solid var(--linha); border-radius: 6px; padding: 10px 12px;
  margin-bottom: 8px; box-shadow: var(--sombra);
}
.item strong { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
.item .onde { color: var(--secundario); font-size: 14px; }
.item .ha { font-size: 13px; color: var(--secundario); margin: 4px 0 8px; }
.item .ha.parada { color: var(--ambar); font-weight: 500; }
.item select { width: 100%; padding: 5px 6px; border: 1px solid var(--linha); border-radius: 5px; background: var(--superficie); font-size: 14px; }
.item .links { display: flex; justify-content: space-between; margin-top: 6px; font-size: 14px; }
.historico { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; color: var(--secundario); }
.historico li { padding: 2px 0; }

/* follow-up */
.mensagem-modelo { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; margin-bottom: 14px; }
.mensagem-modelo p { margin: 6px 0 10px; max-width: 70ch; }

/* raio-x */
.raiox { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.painel-bloco { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px 18px; }
.painel-bloco h3 { margin: 0 0 2px; font: 600 18px var(--sans); }
.painel-bloco > p { margin: 0 0 12px; color: var(--secundario); font-size: 15px; }
.barra { display: grid; grid-template-columns: 1fr 44px; gap: 4px 10px; align-items: center; margin: 9px 0; }
.barra span { font-size: 15px; }
.barra b { font: 600 18px var(--cond); text-align: right; font-variant-numeric: tabular-nums; }
.barra i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--linha); position: relative; overflow: hidden; }
.barra i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--cor); border-radius: 3px; }
.barra small { grid-column: 1 / -1; color: var(--secundario); font-size: 13px; margin-top: -2px; }

/* vazio, aviso, toast */
.vazio { text-align: left; padding: 40px 24px; background: var(--superficie); border: 1px dashed var(--linha); border-radius: var(--raio); }
.vazio h3 { margin: 0 0 4px; font: 600 20px var(--sans); }
.vazio p { margin: 0 0 14px; color: var(--secundario); max-width: 60ch; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--tinta); color: var(--fundo); padding: 10px 14px; border-radius: 8px; display: flex;
  gap: 14px; align-items: center; transition: opacity .18s, transform .18s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.visivel { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* aviso no topo */
.aviso {
  display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; justify-content: space-between;
  background: var(--ambar-claro); border-radius: var(--raio); padding: 10px 14px; margin: 0 0 14px;
}
.aviso.info { background: var(--cobalto-claro); }
.aviso p { margin: 0; max-width: 78ch; }
.aviso[hidden] { display: none; }

/* janela (adicionar vaga, entrevista) */
dialog.janela {
  border: 1px solid var(--linha); border-radius: 10px; padding: 0; width: min(760px, calc(100% - 24px));
  max-height: calc(100vh - 40px); background: var(--superficie); color: var(--tinta);
  box-shadow: 0 16px 48px rgba(16, 22, 30, .28);
}
dialog.janela::backdrop { background: rgba(16, 22, 30, .45); }
.janela > header {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 16px 20px 12px; border-bottom: 1px solid var(--linha); position: sticky; top: 0; background: var(--superficie); z-index: 1;
}
.janela > header h2 { margin: 0; font: 600 24px/1.15 var(--cond); }
.janela > header p { margin: 3px 0 0; color: var(--secundario); font-size: 15px; }
.janela .corpo { padding: 16px 20px 22px; }
.janela h3 { font: 600 17px var(--sans); margin: 20px 0 6px; }
.janela ul { margin: 0; padding-left: 20px; }
.janela li { margin: 3px 0; }

/* formulários */
.campo { display: grid; gap: 4px; margin-bottom: 12px; }
.campo label { font-weight: 500; font-size: 15px; }
.campo small { color: var(--secundario); font-size: 13px; }
.campo input:not([type=checkbox]), .campo textarea, .campo select {
  padding: 8px 10px; border: 1px solid var(--linha); border-radius: 6px; background: var(--superficie); width: 100%; min-width: 0;
}
.campo textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }
.marcar { display: flex; gap: 8px; align-items: center; font-size: 15px; margin: 2px 0 10px; cursor: pointer; }
.marcar input { width: 17px; height: 17px; accent-color: var(--cobalto); }
.acoes-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.retorno { font-size: 14px; color: var(--secundario); }
.retorno.ok { color: var(--verde); }
.retorno.erro { color: var(--vermelho); }
.secao-config { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px 18px 6px; margin-bottom: 14px; }
.secao-config h3 { margin: 0 0 2px; font: 600 18px var(--sans); }
.secao-config > p { margin: 0 0 14px; color: var(--secundario); font-size: 15px; max-width: 75ch; }
.rodape-salvar {
  position: sticky; bottom: 0; background: var(--fundo); padding: 12px 0; display: flex; gap: 12px;
  align-items: center; border-top: 1px solid var(--linha);
}

/* entrevista */
.pergunta { border-top: 1px solid var(--linha); padding: 12px 0; }
.pergunta:first-child { border-top: 0; padding-top: 0; }
.pergunta h4 { margin: 0 0 3px; font: 600 16px/1.35 var(--sans); }
.pergunta .motivo { color: var(--secundario); font-size: 14px; margin: 0 0 6px; }
.pergunta p { margin: 0; max-width: 75ch; }

/* sugestões e resultados */
.sugestoes { list-style: none; margin: 0; padding: 0; }
.sugestoes li { padding: 10px 0; border-top: 1px solid var(--linha); }
.sugestoes li:first-child { border-top: 0; padding-top: 0; }
.sugestoes strong { font-weight: 600; }
.sugestoes > li > span { display: block; color: var(--secundario); font-size: 15px; max-width: 80ch; margin-top: 2px; }
.tipo { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
.tipo.incluir { background: var(--ambar-claro); color: var(--ambar); }
.tipo.destacar, .tipo.cargo { background: var(--verde-claro); color: var(--verde); }
.tipo.ajustar { background: var(--cobalto-claro); color: var(--cobalto); }
.destaque-numero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.destaque-numero b { font: 600 52px/1 var(--cond); font-variant-numeric: tabular-nums; }
.destaque-numero p { margin: 0; max-width: 52ch; }
.tabela { width: 100%; border-collapse: collapse; font-size: 15px; }
.tabela th, .tabela td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--linha); }
.tabela th { font-weight: 500; color: var(--secundario); border-top: 0; font-size: 14px; }
.tabela .num { text-align: right; font-variant-numeric: tabular-nums; }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }

@media (max-width: 760px) {
  .duas, .tres, .grade-2 { grid-template-columns: 1fr; }
  .vaga-linha { grid-template-columns: 56px 1fr; gap: 12px; padding: 14px; }
  .nota b { font-size: 30px; }
  .acoes { grid-column: 1 / -1; justify-content: flex-start; }
  .detalhe { padding: 0 14px 16px; }
  .raiox { grid-template-columns: 1fr; }
  .quadro { grid-template-columns: 1fr; overflow: visible; }
  .topo h1 { font-size: 26px; }
}
</style>
</head>
<body>
<div class="casca">
  <header class="topo">
    <div>
      <h1>Minhas vagas</h1>
      <p id="subtitulo">Carregando…</p>
    </div>
    <div class="busca-agora">
      <button class="btn" id="btn-adicionar" type="button">Adicionar vaga</button>
      <button class="btn primario" id="btn-buscar" type="button">Buscar vagas agora</button>
      <span class="estado" id="estado-busca" role="status" aria-live="polite"></span>
    </div>
  </header>

  <div class="aviso" id="aviso" hidden></div>

  <nav class="abas" role="tablist" aria-label="Seções">
    <button class="aba" role="tab" data-aba="fila" aria-selected="true">Para decidir <span class="n" id="n-fila"></span></button>
    <button class="aba" role="tab" data-aba="candidaturas" aria-selected="false">Candidaturas <span class="n" id="n-candidaturas"></span></button>
    <button class="aba" role="tab" data-aba="followup" aria-selected="false">Follow-up <span class="n" id="n-followup"></span></button>
    <button class="aba" role="tab" data-aba="raiox" aria-selected="false">Raio-x e currículo</button>
    <button class="aba" role="tab" data-aba="resultados" aria-selected="false">Resultados</button>
    <button class="aba" role="tab" data-aba="descartadas" aria-selected="false">Descartadas <span class="n" id="n-descartadas"></span></button>
    <button class="aba" role="tab" data-aba="config" aria-selected="false">Configurações</button>
  </nav>

  <div class="ferramentas" id="ferramentas">
    <input type="search" id="filtro-texto" placeholder="Filtrar por cargo, empresa ou cidade" aria-label="Filtrar vagas">
    <select id="filtro-nota" aria-label="Nota mínima">
      <option value="0">Qualquer nota</option>
      <option value="65">Nota 65 ou mais</option>
      <option value="75">Nota 75 ou mais</option>
      <option value="85">Nota 85 ou mais</option>
    </select>
  </div>

  <main id="conteudo" tabindex="-1"></main>
</div>

<dialog class="janela" id="janela" aria-labelledby="janela-titulo">
  <header><div><h2 id="janela-titulo"></h2><p id="janela-sub"></p></div><button class="btn sutil" type="button" id="janela-fechar">Fechar</button></header>
  <div class="corpo" id="janela-corpo"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-texto"></span><button type="button" id="toast-desfazer" hidden>Desfazer</button></div>

<script>
const estado = { aba: "fila", resumo: null, timerBusca: null };
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, {
    headers: { "Content-Type": "application/json" }, ...opcoes,
    body: opcoes.body ? JSON.stringify(opcoes.body) : undefined,
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || `Erro ${r.status}`);
  return dados;
}

function dias(iso) {
  if (!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}
function haDias(iso) {
  const d = dias(iso);
  return d === 0 ? "hoje" : d === 1 ? "há 1 dia" : `há ${d} dias`;
}
function classeNota(n) {
  const min = estado.resumo?.nota_minima ?? 65;
  return n >= 85 ? "n-alta" : n >= min ? "n-boa" : "n-baixa";
}
function onde(v) {
  return [v.empresa, v.cidade, v.remoto ? "remoto" : ""].filter(Boolean).map(esc).join(", ");
}

/* ---------- toast ---------- */
let timerToast;
function avisar(texto, desfazer) {
  const t = $("#toast"), b = $("#toast-desfazer");
  $("#toast-texto").textContent = texto;
  b.hidden = !desfazer;
  b.onclick = async () => { t.classList.remove("visivel"); await desfazer(); };
  t.classList.add("visivel");
  clearTimeout(timerToast);
  timerToast = setTimeout(() => t.classList.remove("visivel"), desfazer ? 6000 : 3000);
}

/* ---------- resumo e abas ---------- */
async function carregarResumo() {
  const r = await api("/api/resumo");
  estado.resumo = r;
  $("#n-fila").textContent = r.fila || "";
  $("#n-candidaturas").textContent = r.candidaturas || "";
  const nf = $("#n-followup");
  nf.textContent = r.followups || "";
  nf.classList.toggle("alerta", r.followups > 0);
  $("#n-descartadas").textContent = r.descartadas || "";
  const partes = [];
  partes.push(r.fila === 1 ? "1 vaga para decidir" : `${r.fila} vagas para decidir`);
  partes.push(r.ativas === 1 ? "1 candidatura em andamento" : `${r.ativas} candidaturas em andamento`);
  if (r.followups) partes.push(r.followups === 1 ? "1 pedindo follow-up" : `${r.followups} pedindo follow-up`);
  $("#subtitulo").textContent = partes.join(", ") + ".";
  mostrarTarefa(r.tarefa);
  mostrarAviso(r);
}

function mostrarAviso(r) {
  const el = $("#aviso");
  let html = "", info = false;
  if (!r.configurado) {
    html = `<p>Comece pelas configurações: seus dados e os cargos que você procura.</p><button class="btn primario" type="button" data-ir="config">Abrir configurações</button>`;
  } else if (!r.ia) {
    html = `<p>As notas estão vindo só de palavras-chave, que erram bastante. Com a chave da Anthropic, cada vaga é lida de verdade e a nota vem explicada.</p><button class="btn" type="button" data-ir="config">Configurar a IA</button>`;
  } else if (r.sem_ia > 0 && !r.tarefa.rodando) {
    info = true;
    html = `<p>${r.sem_ia === 1 ? "1 vaga foi avaliada" : `${r.sem_ia} vagas foram avaliadas`} só por palavras-chave, antes da IA.</p><button class="btn" type="button" data-acao-global="reanalisar">Reanalisar com IA</button>`;
  }
  el.innerHTML = html;
  el.classList.toggle("info", info);
  el.hidden = !html;
}

function trocarAba(aba) {
  estado.aba = aba;
  document.querySelectorAll(".aba").forEach((b) => b.setAttribute("aria-selected", b.dataset.aba === aba));
  const comFiltro = ["fila", "candidaturas", "descartadas"].includes(aba);
  $("#ferramentas").hidden = !comFiltro;
  $("#filtro-nota").hidden = aba === "candidaturas";
  renderizar();
}

async function renderizar() {
  const alvo = $("#conteudo");
  try {
    if (estado.aba === "raiox") return renderRaiox(alvo, await api("/api/raiox"));
    if (estado.aba === "resultados") return renderResultados(alvo, await api("/api/resultados"));
    if (estado.aba === "config") return renderConfig(alvo, await api("/api/config"));
    const q = encodeURIComponent($("#filtro-texto").value);
    const nota = $("#filtro-nota").value;
    const vagas = await api(`/api/vagas?aba=${estado.aba}&q=${q}&nota_min=${nota}`);
    if (estado.aba === "candidaturas") return renderQuadro(alvo, vagas);
    if (estado.aba === "followup") return renderFollowup(alvo, vagas);
    renderFila(alvo, vagas, estado.aba === "descartadas");
  } catch (e) {
    alvo.innerHTML = `<div class="vazio"><h3>Não consegui carregar esta seção</h3><p>${esc(e.message)}. Confira se a janela do terminal com o painel continua aberta.</p></div>`;
  }
}

/* ---------- fila ---------- */
function renderFila(alvo, vagas, descartadas) {
  if (!vagas.length) {
    alvo.innerHTML = descartadas
      ? `<div class="vazio"><h3>Nenhuma vaga descartada</h3><p>Vagas com nota baixa e as que você descartar aparecem aqui, caso queira rever alguma.</p></div>`
      : `<div class="vazio"><h3>Nenhuma vaga para decidir</h3><p>Busque vagas novas agora ou espere a rotina diária. As recomendadas para o seu perfil aparecem aqui, das mais compatíveis para as menos.</p><button class="btn primario" type="button" onclick="buscarAgora()">Buscar vagas agora</button></div>`;
    return;
  }
  alvo.innerHTML = `<div class="fila">${vagas.map((v) => linhaVaga(v, descartadas)).join("")}</div>`;
}

function linhaVaga(v, descartada) {
  const n = v.nota ?? 0;
  const acoes = descartada
    ? `<button class="btn" type="button" data-acao="status" data-status="nova">Trazer de volta</button>`
    : `${v.url ? `<a class="btn primario" href="${esc(v.url)}" target="_blank" rel="noopener">Abrir vaga</a>` : ""}
       <button class="btn" type="button" data-acao="status" data-status="candidatei">Candidatei</button>
       ${v.status === "depois" ? "" : `<button class="btn sutil" type="button" data-acao="status" data-status="depois">Depois</button>`}
       <button class="btn sutil" type="button" data-acao="status" data-status="descartada">Descartar</button>`;
  return `
  <article class="vaga" data-id="${v.id}">
    <div class="vaga-linha">
      <div class="nota ${classeNota(n)}" title="Compatibilidade com o seu currículo">
        <b>${n}</b><div class="medidor" aria-hidden="true"><i style="width:${n}%"></i></div>
        <small>${v.metodo === "ia" ? "análise IA" : "por palavras"}</small>
      </div>
      <div class="info">
        <h3>${esc(v.titulo)}${v.status === "depois" ? `<span class="etiqueta depois">adiada</span>` : ""}${v.email ? `<span class="etiqueta">aceita e-mail</span>` : ""}${v.manual ? `<span class="etiqueta">adicionada por você</span>` : ""}</h3>
        <div class="onde">${onde(v)}</div>
        ${v.resumo ? `<p class="por-que">${esc(v.resumo)}</p>` : ""}
        <button class="btn sutil" type="button" data-acao="detalhe" aria-expanded="false" style="margin:6px 0 0 -12px">Ver análise e respostas</button>
      </div>
      <div class="acoes">${acoes}</div>
    </div>
    <div class="detalhe" hidden></div>
  </article>`;
}

async function abrirDetalhe(artigo, botao) {
  const caixa = $(".detalhe", artigo);
  const aberto = botao.getAttribute("aria-expanded") === "true";
  botao.setAttribute("aria-expanded", !aberto);
  botao.textContent = aberto ? "Ver análise e respostas" : "Fechar análise";
  caixa.hidden = aberto;
  if (aberto || caixa.dataset.carregado) return;
  const v = await api(`/api/vagas/${artigo.dataset.id}`);
  caixa.dataset.carregado = "1";
  caixa.innerHTML = `
    ${v.pontos_fortes.length ? `<div class="grupo"><h4>A seu favor</h4><div class="chips">${v.pontos_fortes.map((p) => `<span class="chip favor">${esc(p)}</span>`).join("")}</div></div>` : ""}
    ${v.lacunas.length ? `<div class="grupo"><h4>O que a vaga pede e você não mostra</h4><div class="chips">${v.lacunas.map((p) => `<span class="chip falta">${esc(p)}</span>`).join("")}</div></div>` : ""}
    <div class="grupo respostas">
      <h4>Respostas para o formulário</h4>
      <div class="area-respostas">
        ${v.tem_respostas ? "" : `<p class="nota-rodape" style="margin-bottom:8px">Preparo textos para "fale sobre você" e "por que esta vaga", com base no seu currículo.</p>`}
        <button class="btn" type="button" data-acao="respostas">${v.tem_respostas ? "Mostrar respostas" : "Preparar respostas"}</button>
      </div>
    </div>
    ${v.metodo !== "ia" ? `<p class="nota-rodape">Nota calculada por palavras-chave. Com a chave da Anthropic configurada, a análise lê os requisitos de verdade e explica a nota.</p>` : ""}`;
}

async function carregarRespostas(artigo, botao) {
  botao.disabled = true;
  botao.textContent = "Preparando…";
  try {
    const r = await api(`/api/vagas/${artigo.dataset.id}/respostas`);
    const bloco = (titulo, texto) => `<div class="resposta"><header><strong>${titulo}</strong><button class="btn sutil" type="button" data-copiar>Copiar</button></header><p>${esc(texto)}</p></div>`;
    botao.closest(".area-respostas").innerHTML = `<div style="display:grid;gap:10px">
      ${bloco("Fale sobre você", r.apresentacao)}
      ${bloco("Por que você quer esta vaga?", r.por_que_vaga)}
      ${r.destaques?.length ? `<div class="resposta"><header><strong>Experiências para mencionar</strong></header><ul>${r.destaques.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      ${r.atencao?.length ? `<div class="resposta"><header><strong>Prepare-se para falar sobre</strong></header><ul>${r.atencao.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      <p class="nota-rodape">Revise antes de enviar: a candidatura vai em seu nome.</p></div>`;
  } catch (e) {
    botao.disabled = false;
    botao.textContent = "Tentar de novo";
    avisar(e.message);
  }
}

async function mudarStatus(artigo, status) {
  const id = artigo.dataset.id;
  const antes = await api(`/api/vagas/${id}`);
  await api(`/api/vagas/${id}/status`, { method: "POST", body: { status } });
  const nomes = { candidatei: "Marcada como candidatura feita", depois: "Adiada para depois", descartada: "Vaga descartada", nova: "Vaga de volta para decidir" };
  artigo.remove();
  if (!$(".vaga")) renderizar();
  await carregarResumo();
  avisar(nomes[status], antes.status !== status ? async () => {
    await api(`/api/vagas/${id}/status`, { method: "POST", body: { status: antes.status === "baixa" ? "descartada" : antes.status } });
    await carregarResumo(); renderizar();
  } : null);
}

/* ---------- candidaturas ---------- */
function renderQuadro(alvo, vagas) {
  if (!vagas.length) {
    alvo.innerHTML = `<div class="vazio"><h3>Nenhuma candidatura ainda</h3><p>Quando você marcar "Candidatei" numa vaga, ela aparece aqui para você acompanhar cada etapa até a resposta.</p><button class="btn" type="button" onclick="trocarAba('fila')">Ver vagas para decidir</button></div>`;
    return;
  }
  const nomes = estado.resumo.nomes_etapas;
  const encerradas = ["aprovado", "reprovado", "sem_resposta", "desisti"];
  const colunas = [...estado.resumo.etapas_ativas.map((e) => [e, nomes[e]]), ["encerradas", "Encerradas"]];
  const limite = estado.resumo.dias_followup;
  const opcoes = (atual) => Object.entries(nomes).map(([k, n]) => `<option value="${k}" ${k === atual ? "selected" : ""}>${esc(n)}</option>`).join("");
  alvo.innerHTML = `<div class="quadro">${colunas.map(([chave, nome]) => {
    const itens = vagas.filter((v) => chave === "encerradas" ? encerradas.includes(v.etapa) : v.etapa === chave);
    return `<section class="coluna" aria-label="${esc(nome)}"><h3>${esc(nome)} <span>${itens.length || ""}</span></h3>
      ${itens.length ? itens.map((v) => {
        const parada = !encerradas.includes(v.etapa) && dias(v.etapa_em) >= limite;
        return `<div class="item" data-id="${v.id}">
          <strong>${esc(v.titulo)}</strong><div class="onde">${esc(v.empresa || "")}</div>
          <div class="ha ${parada ? "parada" : ""}">${chave === "encerradas" ? esc(nomes[v.etapa]) + ", " : ""}${haDias(v.etapa_em)}${parada ? ", sem novidade" : ""}</div>
          <label class="sr" style="position:absolute;left:-9999px" for="etapa-${v.id}">Etapa</label>
          <select id="etapa-${v.id}" data-acao="etapa">${opcoes(v.etapa)}</select>
          <div class="links">${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">Abrir vaga</a>` : "<span></span>"}<button class="btn sutil" type="button" data-acao="historico" style="padding:0 4px">Histórico</button></div>
          ${chave === "encerradas" ? "" : `<button class="btn ${["entrevista", "teste", "proposta"].includes(v.etapa) ? "primario" : ""}" type="button" data-acao="entrevista" style="width:100%;justify-content:center;margin-top:8px">Preparar entrevista</button>`}
        </div>`;
      }).join("") : `<div class="vazia">Nada aqui.</div>`}
    </section>`;
  }).join("")}</div>`;
}

async function mudarEtapa(item, etapa) {
  let obs = "";
  if (["entrevista", "teste", "proposta"].includes(etapa)) {
    obs = prompt("Quer anotar algo? Por exemplo, data e horário da entrevista.", "") || "";
  }
  await api(`/api/vagas/${item.dataset.id}/etapa`, { method: "POST", body: { etapa, obs } });
  avisar(etapa === "entrevista" ? "Etapa atualizada: Entrevista. Use \"Preparar entrevista\" no cartão." : `Etapa atualizada: ${estado.resumo.nomes_etapas[etapa]}`);
  await carregarResumo();
  renderizar();
}

async function mostrarHistorico(item, botao) {
  const existente = $(".historico", item);
  if (existente) { existente.remove(); return; }
  const v = await api(`/api/vagas/${item.dataset.id}`);
  const lista = document.createElement("ul");
  lista.className = "historico";
  lista.innerHTML = v.historico.map((h) => `<li>${new Date(h.data).toLocaleDateString("pt-BR")}: ${esc(h.nome)}${h.obs ? ` (${esc(h.obs)})` : ""}</li>`).join("") || "<li>Sem registros.</li>";
  item.appendChild(lista);
}

/* ---------- follow-up ---------- */
function renderFollowup(alvo, vagas) {
  const limite = estado.resumo.dias_followup;
  if (!vagas.length) {
    alvo.innerHTML = `<div class="vazio"><h3>Nenhuma candidatura parada</h3><p>Quando uma empresa ficar ${limite} dias sem dar retorno, ela aparece aqui com uma sugestão de mensagem para o recrutador.</p></div>`;
    return;
  }
  const modelo = (v) => `Olá! Me candidatei à vaga de ${v.titulo} ${v.empresa ? `na empresa ${v.empresa}` : ""} e continuo muito interessado. Gostaria de saber se há novidades sobre o processo seletivo. Obrigado pela atenção!`;
  alvo.innerHTML = `<p class="nota-rodape" style="margin:16px 0 12px">Sem retorno há ${limite} dias ou mais. Um contato curto e educado com o recrutador, pelo LinkedIn ou por e-mail, mostra interesse e às vezes destrava o processo.</p>
    ${vagas.map((v) => `<div class="mensagem-modelo" data-id="${v.id}">
      <strong>${esc(v.titulo)}</strong> <span class="onde" style="color:var(--secundario)">${esc(v.empresa || "")}, ${esc(estado.resumo.nomes_etapas[v.etapa] || "")} ${haDias(v.etapa_em)}</span>
      <p>${esc(modelo(v))}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="button" data-copiar-texto="${esc(modelo(v))}">Copiar mensagem</button>
        <button class="btn primario" type="button" data-acao="followup">Registrar follow-up</button>
        ${v.url ? `<a class="btn sutil" href="${esc(v.url)}" target="_blank" rel="noopener">Abrir vaga</a>` : ""}
      </div></div>`).join("")}`;
}

/* ---------- raio-x ---------- */
function renderRaiox(alvo, r) {
  if (r.erro) { alvo.innerHTML = `<div class="vazio"><h3>Não consegui montar o raio-x</h3><p>${esc(r.erro)}</p></div>`; return; }
  if (!r.total_area) {
    alvo.innerHTML = `<div class="vazio"><h3>Ainda sem dados suficientes</h3><p>O raio-x junta o que as vagas da sua área pedem. Faça algumas buscas e ele começa a mostrar tendências.</p><button class="btn primario" type="button" onclick="buscarAgora()">Buscar vagas agora</button></div>`;
    return;
  }
  const barras = (itens, cor, quase) => itens.map((i) => `<div class="barra" style="--p:${i.percentual}%;--cor:${cor}">
      <span>${esc(i.habilidade)}</span><b>${i.percentual}%</b><i></i>
      ${quase && i.em_quase ? `<small>Pedido em ${i.em_quase} de ${r.total_quase} vagas perto da sua nota de corte</small>` : ""}</div>`).join("");
  alvo.innerHTML = blocoSugestoes(r) + `
    <p class="nota-rodape" style="margin:20px 0 14px">Raio-x baseado em ${r.total_area} vagas da sua área. A porcentagem mostra em quantas delas o termo aparece: é tendência, não requisito obrigatório.</p>
    <div class="raiox">
      <section class="painel-bloco">
        <h3>Pedem e falta no seu currículo</h3>
        <p>Bons candidatos a estudo, curso ou certificação. Se você já tem, acrescente no currículo.</p>
        ${r.faltam.length ? barras(r.faltam, "var(--ambar)", true) : "<p>Seu currículo cobre o que mais aparece. Ótimo sinal.</p>"}
      </section>
      <section class="painel-bloco">
        <h3>Você já tem e é muito pedido</h3>
        <p>Deixe em destaque no topo do currículo e nas entrevistas.</p>
        ${barras(r.tenho, "var(--verde)")}
      </section>
      ${r.lacunas_ia.length ? `<section class="painel-bloco" style="grid-column:1/-1">
        <h3>Lacunas mais apontadas pela análise com IA</h3>
        <p>Inclui requisitos que não são ferramentas, como tempo de experiência e formação.</p>
        <div class="chips">${r.lacunas_ia.map(([l, n]) => `<span class="chip falta">${esc(l)} (${n})</span>`).join("")}</div>
      </section>` : !r.usou_ia ? `<p class="nota-rodape" style="grid-column:1/-1">Com a chave da Anthropic configurada, o raio-x também mostra as lacunas que a IA aponta em cada vaga, como tempo de experiência e nível de inglês.</p>` : ""}
    </div>`;
}

/* ---------- sugestões de currículo (aba raio-x) ---------- */
const NOME_TIPO = { incluir: "Incluir", destacar: "Destacar", cargo: "Nome do cargo", ajustar: "Ajustar" };
function blocoSugestoes(r) {
  const itens = (r.sugestoes || []).map((s) => `<li><strong><span class="tipo ${esc(s.tipo)}">${NOME_TIPO[s.tipo] || "Ajustar"}</span>${esc(s.titulo)}</strong><span>${esc(s.detalhe)}</span></li>`).join("");
  const ia = estado.resumo?.ia;
  return `<section class="painel-bloco" style="margin-top:16px">
    <h3>Sugestões para o seu currículo</h3>
    <p>Com base no que as vagas da sua área pedem. Só inclua o que for verdade.</p>
    ${itens ? `<ul class="sugestoes">${itens}</ul>` : "<p>Nada a sugerir por enquanto.</p>"}
    <div id="area-curriculo-ia" style="margin-top:14px">
      ${ia ? `<button class="btn" type="button" data-acao-global="curriculo-ia">Pedir sugestões detalhadas à IA</button>
              <span class="retorno" style="margin-left:8px">Ela propõe um novo resumo e reescreve trechos, sem inventar nada.</span>`
           : `<p class="nota-rodape">Com a chave da Anthropic, a IA também propõe um novo resumo e reescreve trechos do currículo.</p>`}
    </div>
  </section>`;
}

async function curriculoIA(botao) {
  const area = $("#area-curriculo-ia");
  botao.disabled = true; botao.textContent = "Pensando… (até 1 minuto)";
  try {
    const d = await api("/api/curriculo/ia", { method: "POST" });
    area.innerHTML = `
      ${d.resumo_sugerido ? `<div class="resposta"><header><strong>Resumo sugerido</strong><button class="btn sutil" type="button" data-copiar>Copiar</button></header><p>${esc(d.resumo_sugerido)}</p></div>` : ""}
      ${d.ajustes.length ? `<h4 style="margin:16px 0 4px;font:600 15px var(--sans)">Ajustes sugeridos</h4><ul class="sugestoes">${d.ajustes.map((a) => `<li><strong>${esc(a.secao)}</strong><span>${esc(a.sugestao)}</span>${a.exemplo ? `<div class="resposta" style="margin-top:6px"><p>${esc(a.exemplo)}</p></div>` : ""}</li>`).join("")}</ul>` : ""}
      ${d.palavras_chave.length ? `<h4 style="margin:16px 0 6px;font:600 15px var(--sans)">Termos das vagas que você já domina</h4><div class="chips">${d.palavras_chave.map((p) => `<span class="chip favor">${esc(p)}</span>`).join("")}</div>` : ""}
      <p class="nota-rodape" style="margin-top:12px">Onde aparecer [colchetes], complete com seus dados reais.</p>`;
  } catch (e) {
    botao.disabled = false; botao.textContent = "Tentar de novo"; avisar(e.message);
  }
}

/* ---------- tarefas demoradas: busca e reanálise ---------- */
function mostrarTarefa(t) {
  const botao = $("#btn-buscar");
  botao.disabled = t.rodando;
  botao.textContent = t.rodando && t.tipo === "busca" ? "Buscando…" : "Buscar vagas agora";
  $("#estado-busca").textContent = t.rodando
    ? (t.tipo === "reanalise" ? "Reanalisando com IA. Pode levar alguns minutos." : "Isso leva de um a alguns minutos.")
    : (t.mensagem || "");
}
async function iniciarTarefa(caminho) {
  mostrarTarefa(await api(caminho, { method: "POST" }));
  $("#aviso").hidden = true;
  clearInterval(estado.timerBusca);
  estado.timerBusca = setInterval(async () => {
    const r = await api("/api/resumo");
    mostrarTarefa(r.tarefa);
    if (!r.tarefa.rodando) {
      clearInterval(estado.timerBusca);
      await carregarResumo();
      if (["fila", "raiox", "descartadas"].includes(estado.aba)) renderizar();
    }
  }, 3000);
}
const buscarAgora = () => iniciarTarefa("/api/buscar").catch((e) => avisar(e.message));

/* ---------- janela ---------- */
function abrirJanela(titulo, sub, html) {
  $("#janela-titulo").textContent = titulo;
  $("#janela-sub").textContent = sub || "";
  $("#janela-corpo").innerHTML = html;
  const j = $("#janela");
  if (!j.open) j.showModal();
  j.scrollTop = 0;
}
const fecharJanela = () => $("#janela").close();

/* ---------- adicionar vaga ---------- */
function janelaAdicionar() {
  abrirJanela("Adicionar vaga", "De qualquer site: InfoJobs, LinkedIn, Catho, Indeed ou indicação.", `
    <form id="form-vaga">
      <div class="duas">
        <div class="campo"><label for="v-titulo">Cargo</label><input id="v-titulo" name="titulo" type="text" required placeholder="Analista de suporte N2"></div>
        <div class="campo"><label for="v-empresa">Empresa</label><input id="v-empresa" name="empresa" type="text"></div>
      </div>
      <div class="campo"><label for="v-url">Link da vaga</label><input id="v-url" name="url" type="url" placeholder="https://…"></div>
      <div class="duas">
        <div class="campo"><label for="v-cidade">Cidade</label><input id="v-cidade" name="cidade" type="text"></div>
        <div class="campo"><label>&nbsp;</label><label class="marcar"><input type="checkbox" name="remoto"> Vaga remota</label></div>
      </div>
      <div class="campo"><label for="v-descricao">Descrição da vaga</label>
        <textarea id="v-descricao" name="descricao" required style="min-height:200px" placeholder="Cole aqui o texto inteiro: atividades, requisitos, diferenciais."></textarea>
        <small>Quanto mais completa a descrição, melhor a análise.</small></div>
      <div class="acoes-form"><button class="btn primario" type="submit">Analisar e adicionar</button><span class="retorno" id="retorno-vaga" role="status"></span></div>
    </form>`);
  $("#v-titulo").focus();
}

async function enviarVaga(form) {
  const botao = $("button[type=submit]", form), ret = $("#retorno-vaga");
  const dados = Object.fromEntries(new FormData(form));
  dados.remoto = form.remoto.checked;
  botao.disabled = true; botao.textContent = "Analisando…"; ret.textContent = ""; ret.className = "retorno";
  try {
    const v = await api("/api/vagas", { method: "POST", body: dados });
    fecharJanela();
    await carregarResumo();
    trocarAba("fila");
    avisar(v.ja_existia ? "Essa vaga já estava na sua lista." : `Vaga adicionada com nota ${v.nota}.`);
  } catch (e) {
    ret.textContent = e.message; ret.className = "retorno erro";
    botao.disabled = false; botao.textContent = "Analisar e adicionar";
  }
}

/* ---------- entrevista ---------- */
async function janelaEntrevista(id, refazer = false) {
  const card = $(`.item[data-id="${id}"] strong`);
  abrirJanela("Preparação para entrevista", card ? card.textContent : "", `<p class="retorno" role="status">Preparando perguntas e respostas…</p>`);
  try {
    const p = await api(`/api/vagas/${id}/entrevista${refazer ? "?refazer=1" : ""}`);
    $("#janela-sub").textContent = [p.titulo, p.empresa].filter(Boolean).join(", ");
    const texto = [
      ...p.perguntas.map((q, i) => `${i + 1}. ${q.pergunta}\nPor que perguntam: ${q.motivo}\nComo responder: ${q.como_responder}`),
      "", "Perguntas para você fazer:", ...p.para_perguntar.map((x) => "- " + x),
      "", "Pesquise antes:", ...p.pesquisar.map((x) => "- " + x)].join("\n");
    $("#janela-corpo").innerHTML = `
      ${p.metodo === "ia" ? "" : `<p class="aviso" style="display:block">Roteiro padrão montado com a análise da vaga. Com a chave da Anthropic, as perguntas e respostas são feitas para esta vaga e o seu currículo.</p>`}
      <div class="acoes-form" style="margin-bottom:14px">
        <button class="btn" type="button" data-copiar-texto="${esc(texto)}">Copiar tudo</button>
        ${estado.resumo?.ia ? `<button class="btn sutil" type="button" data-acao-global="refazer-entrevista" data-id="${id}">Gerar de novo</button>` : ""}
      </div>
      <h3 style="margin-top:0">Perguntas prováveis</h3>
      ${p.perguntas.map((q) => `<div class="pergunta"><h4>${esc(q.pergunta)}</h4><p class="motivo">${esc(q.motivo)}</p><p>${esc(q.como_responder)}</p></div>`).join("")}
      <h3>Perguntas para você fazer</h3><ul>${p.para_perguntar.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <h3>Pesquise antes</h3><ul>${p.pesquisar.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <p class="nota-rodape" style="margin-top:16px">Onde aparecer [colchetes], complete com seus dados reais. Ensaie em voz alta: ajuda mais do que reler.</p>`;
  } catch (e) {
    $("#janela-corpo").innerHTML = `<p class="retorno erro">${esc(e.message)}</p>`;
  }
}

/* ---------- resultados ---------- */
function renderResultados(alvo, r) {
  const g = r.geral;
  if (!g.total) {
    alvo.innerHTML = `<div class="vazio" style="margin-top:16px"><h3>Ainda sem candidaturas</h3><p>Aqui você vai ver quais candidaturas avançam (por nota, fonte e cargo) e o que ajustar na busca. Marque "Candidatei" nas vagas e atualize as etapas conforme as respostas chegarem.</p></div>`;
    return;
  }
  const taxa = (x) => x.taxa === null || x.taxa === undefined ? `<span style="color:var(--secundario)">aguardando</span>` : `${x.taxa}%`;
  const tabela = (rotulo, linhas, chave) => linhas.filter((l) => l.total).length ? `<section class="painel-bloco"><h3>${rotulo}</h3>
    <table class="tabela"><thead><tr><th>${chave === "faixa" ? "Nota" : chave === "fonte" ? "Fonte" : chave === "cargo" ? "Cargo" : "Modalidade"}</th><th class="num">Candidaturas</th><th class="num">Com resultado</th><th class="num">Taxa de avanço</th></tr></thead>
    <tbody>${linhas.filter((l) => l.total).map((l) => `<tr><td>${esc(l[chave])}</td><td class="num">${l.total}</td><td class="num">${l.com_resultado}</td><td class="num">${taxa(l)}</td></tr>`).join("")}</tbody></table></section>` : "";
  alvo.innerHTML = `
    <section class="painel-bloco" style="margin-top:16px">
      <div class="destaque-numero"><b>${g.taxa === null ? "–" : g.taxa + "%"}</b>
        <p>${g.com_resultado ? `Das ${g.com_resultado} candidaturas que já tiveram resultado, ${g.avancaram} ${g.avancaram === 1 ? "avançou" : "avançaram"} para teste, entrevista ou proposta.` : "Nenhuma candidatura teve resultado ainda."} ${g.total - g.com_resultado ? `${g.total - g.com_resultado} ainda ${g.total - g.com_resultado === 1 ? "aguarda" : "aguardam"} resposta.` : ""}</p></div>
      <h3 style="margin-top:18px">O que isso sugere</h3>
      <ul class="sugestoes">${r.sugestoes.map((s) => `<li><span style="color:var(--tinta)">${esc(s)}</span></li>`).join("")}</ul>
      <p class="nota-rodape" style="margin-top:10px">Conta como resultado: chegar a teste, entrevista ou proposta (avançou), ou ser reprovado, ficar sem resposta ou passar 3 semanas parada (não avançou).</p>
    </section>
    <div class="grade-2">${tabela("Por nota de compatibilidade", r.faixas, "faixa")}${tabela("Por fonte", r.fontes, "fonte")}</div>
    <div class="grade-2">${tabela("Por cargo", r.cargos, "cargo")}${tabela("Remoto ou presencial", r.modalidade, "modalidade")}</div>`;
}

/* ---------- configurações ---------- */

    : `<span class="retorno erro">Sem chave: as notas vêm só de palavras-chave.</span>`;
  alvo.innerHTML = `<form id="form-config" style="margin-top:16px">

        <div class="campo"><label for="c-pret">Pretensão salarial</label><input id="c-pret" name="candidato.pretensao_salarial" type="text" value="${v(c.candidato.pretensao_salarial)}" placeholder="R$ 3.500"></div>
      </div>
      <div class="campo"><label for="c-resumo">Resumo profissional</label><textarea id="c-resumo" name="candidato.resumo">${v(c.candidato.resumo)}</textarea><small>2 ou 3 frases, só com fatos do seu currículo.</small></div>

    <section class="secao-config"><h3>O que procurar</h3><p>Separe os itens por vírgula.</p>

      <div class="duas">

        <div class="campo"><label for="c-excl">Ignorar vagas com estes termos no título</label><input id="c-excl" name="busca.palavras_excluidas" type="text" value="${lista(c.busca.palavras_excluidas)}"></div>
        <div class="campo"><label for="c-dias">Só vagas publicadas nos últimos (dias)</label><input id="c-dias" name="busca.dias_maximos" type="number" min="1" max="90" value="${v(c.busca.dias_maximos)}"></div>
        <div class="campo"><label>&nbsp;</label><label class="marcar"><input type="checkbox" name="busca.aceitar_remoto" ${marcado(c.busca.aceitar_remoto)}> Aceito vagas remotas</label></div>
      </div>
    </section>

    <section class="secao-config"><h3>Onde procurar</h3><p>Gupy tem vagas de todas as áreas. Para o InfoJobs, LinkedIn e outros, use "Adicionar vaga".</p>
      <label class="marcar"><input type="checkbox" name="busca.fontes.gupy" ${marcado(c.busca.fontes.gupy)}> Gupy</label>
      <label class="marcar"><input type="checkbox" name="busca.fontes.github_vagas" ${marcado(c.busca.fontes.github_vagas)}> Repositórios de vagas no GitHub (programação; muitas aceitam e-mail)</label>
      <label class="marcar"><input type="checkbox" name="busca.fontes.adzuna" ${marcado(c.busca.fontes.adzuna)}> Adzuna (agrega vários sites; cadastro grátis em developer.adzuna.com)</label>
      <div class="tres">

        <div class="campo"><label for="c-azkey">Adzuna app_key</label><input id="c-azkey" name="busca.adzuna_app_key" type="password" placeholder="${c.busca.adzuna_tem_chave ? "guardada; preencha só para trocar" : ""}" autocomplete="off"></div>
        <div class="campo"><label for="c-azonde">Região na Adzuna</label><input id="c-azonde" name="busca.adzuna_onde" type="text" value="${v(c.busca.adzuna_onde)}" placeholder="Rio Grande do Sul"></div>

      <p>A chave da Anthropic faz a nota de cada vaga vir de uma leitura de verdade dos requisitos. Crie em console.anthropic.com; o custo é de centavos por busca.</p>
      <div style="margin:-4px 0 12px">${iaStatus}</div>

      <div class="acoes-form" style="margin-bottom:14px"><button class="btn" type="button" data-acao-global="testar-ia">Testar chave</button><span class="retorno" id="retorno-ia" role="status"></span></div>
      <div class="duas">
        <div class="campo"><label for="c-nota">Nota mínima para recomendar</label><input id="c-nota" name="analise.nota_minima" type="number" min="30" max="95" value="${v(c.analise.nota_minima)}"></div>

      <div class="duas">

      <label class="marcar"><input type="checkbox" name="aviso.email" ${marcado(c.aviso.email)}> Mandar o resumo diário por e-mail</label>

        <div class="campo"><label for="c-alerta">Destacar no resumo vagas com nota a partir de</label><input id="c-alerta" name="aviso.nota_alerta" type="number" min="30" max="100" value="${v(c.aviso.nota_alerta)}"></div>

  </form>`;
}

function lerFormConfig(form) {
  const d = {};
  const por = (caminho, valor) => {
    const partes = caminho.split("."); let o = d;
    partes.slice(0, -1).forEach((p) => (o = o[p] ??= {}));
    o[partes.at(-1)] = valor;
  };
  form.querySelectorAll("input, textarea").forEach((el) => {
    if (!el.name) return;
    if (el.type === "checkbox") por(el.name, el.checked);
    else if (el.type === "password") { if (el.value.trim()) por(el.name, el.value.trim()); }
    else por(el.name, el.value);
  });
  return d;
}

async function salvarConfig(form) {
  const ret = $("#retorno-config"), botao = $("button[type=submit]", form);
  botao.disabled = true; ret.textContent = "Salvando…"; ret.className = "retorno";
  try {
    const c = await api("/api/config", { method: "POST", body: lerFormConfig(form) });
    await carregarResumo();
    renderConfig($("#conteudo"), c);
    avisar("Configurações salvas.");
  } catch (e) {
    ret.textContent = e.message; ret.className = "retorno erro"; botao.disabled = false;
  }
}

async function testar(tipo) {
  const ret = $(tipo === "ia" ? "#retorno-ia" : "#retorno-email");
  ret.textContent = "Testando…"; ret.className = "retorno";
  const corpo = tipo === "ia"
    ? { chave_api: $("#c-chave").value.trim() }
    : { usuario: $("#c-smtpu").value.trim(), senha: $("#c-smtps").value.trim() };
  try {
    const r = await api(tipo === "ia" ? "/api/config/testar-ia" : "/api/config/testar-email", { method: "POST", body: corpo });
    ret.textContent = r.mensagem + (r.ok && (corpo.chave_api || corpo.senha) ? " Clique em Salvar configurações para guardar." : "");
    ret.className = "retorno " + (r.ok ? "ok" : "erro");
  } catch (e) { ret.textContent = e.message; ret.className = "retorno erro"; }
}

/* ---------- eventos ---------- */
async function copiar(texto, botao) {
  try { await navigator.clipboard.writeText(texto); } catch { const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  const antes = botao.textContent;
  botao.textContent = "Copiado";
  setTimeout(() => (botao.textContent = antes), 1600);
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("button");
  if (!el) return;
  if (el.classList.contains("aba")) return trocarAba(el.dataset.aba);
  if (el.id === "btn-buscar") return buscarAgora();
  if (el.id === "btn-adicionar") return janelaAdicionar();
  if (el.id === "janela-fechar") return fecharJanela();
  if (el.dataset.ir) return trocarAba(el.dataset.ir);
  if (el.hasAttribute("data-copiar")) return copiar($("p", el.closest(".resposta")).textContent, el);
  if (el.dataset.copiarTexto) return copiar(el.dataset.copiarTexto, el);
  const artigo = el.closest(".vaga"), item = el.closest(".item"), msg = el.closest(".mensagem-modelo");
  try {
    switch (el.dataset.acaoGlobal) {
      case "reanalisar": return await iniciarTarefa("/api/reanalisar");
      case "curriculo-ia": return await curriculoIA(el);
      case "refazer-entrevista": return await janelaEntrevista(el.dataset.id, true);
      case "testar-ia": return await testar("ia");
      case "testar-email": return await testar("email");
    }
    if (el.dataset.acao === "detalhe") return await abrirDetalhe(artigo, el);
    if (el.dataset.acao === "respostas") return await carregarRespostas(artigo, el);
    if (el.dataset.acao === "status") return await mudarStatus(artigo, el.dataset.status);
    if (el.dataset.acao === "historico") return await mostrarHistorico(item, el);
    if (el.dataset.acao === "entrevista") return await janelaEntrevista(item.dataset.id);
    if (el.dataset.acao === "followup") {
      await api(`/api/vagas/${msg.dataset.id}/followup`, { method: "POST" });
      avisar("Follow-up registrado. O lembrete volta se continuar sem resposta.");
      await carregarResumo(); return renderizar();
    }
  } catch (e) { avisar(e.message); }
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "form-vaga") enviarVaga(ev.target);
  if (ev.target.id === "form-config") salvarConfig(ev.target);
});
document.addEventListener("change", (ev) => {
  if (ev.target.dataset.acao === "etapa") mudarEtapa(ev.target.closest(".item"), ev.target.value).catch((e) => avisar(e.message));
});
$("#janela").addEventListener("click", (ev) => { if (ev.target.id === "janela") fecharJanela(); });
let timerFiltro;
$("#filtro-texto").addEventListener("input", () => { clearTimeout(timerFiltro); timerFiltro = setTimeout(renderizar, 250); });
$("#filtro-nota").addEventListener("change", renderizar);

carregarResumo().then(() => {
  trocarAba(estado.resumo.configurado ? "fila" : "config");
  if (estado.resumo.tarefa.rodando) iniciarTarefa(estado.resumo.tarefa.tipo === "reanalise" ? "/api/reanalisar" : "/api/buscar");
}).catch((e) => { $("#conteudo").innerHTML = `<div class="vazio"><h3>O painel não respondeu</h3><p>${esc(e.message)}. Rode <code>python -m enviador painel</code> de novo no terminal.</p></div>`; });
</script>
